# Free-tier API on Render (Blueprint). Database: a free Neon Postgres (see docs/FREE_DEPLOYMENT.md).
# Secrets marked "sync: false" are asked for in the Render dashboard and are never stored in git.
services:
  - type: web
    name: college-helpdesk-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    # Free instances have 512 MB RAM: one worker, and the port Render assigns.
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COLLEGE_NAME
        value: ABC Engineering College
      - key: CURRENT_ACADEMIC_YEAR
        value: 2026-27
      - key: LLM_PROVIDER
        value: openai            # OpenAI-compatible client, pointed at Gemini below
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: CHAT_MODEL
        value: gemini-3.5-flash-lite
      - key: CHAT_MODEL_FALLBACK
        value: gemini-3.5-flash-lite
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: "1536"
      - key: INLINE_JOBS         # no separate worker on the free tier
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: OPENAI_API_KEY      # your Gemini API key
        sync: false
      - key: DATABASE_URL        # postgresql+asyncpg://USER:PASS@HOST/DB?ssl=require
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FIRST_ADMIN_EMAIL
        value: admin@college.edu
      - key: FIRST_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS        # JSON list, e.g. ["https://your-site.netlify.app"]
        sync: false
