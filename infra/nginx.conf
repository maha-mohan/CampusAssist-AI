# Serves: /widget/ (embed script), /admin/ (dashboard), /demo/ (sample page), /api/ (FastAPI)
server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- API (with SSE streaming support) ---
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;          # stream answers token by token
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # --- Embeddable widget: any college page may load it ---
    location /widget/ {
        alias /usr/share/nginx/html/widget/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=300";
    }

    # --- Admin dashboard (single-page app) ---
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
    }
    location = /admin { return 301 /admin/; }

    # --- Demo college page showing the embed ---
    location /demo/ {
        alias /usr/share/nginx/html/demo/;
    }

    location = / { return 302 /demo/; }
}
