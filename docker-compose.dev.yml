# Just the databases for local development:
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: helpdesk, POSTGRES_PASSWORD: helpdesk, POSTGRES_DB: helpdesk }
    ports: ["5432:5432"]
    volumes: [pgdata_dev:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata_dev:
